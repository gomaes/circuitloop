# circuitloop pipeline settings (not read by the design agent's gates).
[agent]
backend = "claude"       # claude | opencode
# model = "..."          # optional, passed to the backend CLI
timeout = 900            # seconds per agent call (the step is cut off after this)
max_self_checks = 4      # `cloop verify` self-checks per agent step (always --quick)
# max_budget_usd = 2.0   # claude only

[loop]
max_iter = 5             # fix attempts per phase
design_timeout = 120     # seconds for running design.py
sim_timeout = 300        # seconds per ngspice run
# sim_jobs = 4           # parallel ngspice processes (default: automatic)
review = true            # run the reviewer agent in Phase 3
keep_raw = false         # keep raw ngspice waveforms of every iteration (can reach GBs per run)
max_relax = 0.1          # `cloop new` / `run --relax`: largest automatic widening of an infeasible
                         # window limit (fraction of the window centre); larger ones are reported only
relax_rounds = 2
