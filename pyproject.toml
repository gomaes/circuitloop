[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "circuitloop"
version = "0.1.0"
description = "AI-driven autonomous circuit design pipeline for hand-soldered perfboards, with deterministic verification gates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "circuitloop contributors" }]
keywords = ["electronics", "eda", "spice", "ngspice", "skidl", "perfboard", "llm", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.8",
    "skidl>=2.3",
    "matplotlib>=3.8",
    "numpy>=2.0",
]

[project.scripts]
cloop = "circuitloop.cli:main"

[project.urls]
Repository = "https://github.com/gomaes/circuitloop"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/circuitloop"]

[tool.hatch.build.targets.wheel.force-include]
"parts" = "circuitloop/_data/parts"
"checklists" = "circuitloop/_data/checklists"
"examples" = "circuitloop/_data/examples"

[tool.ruff]
line-length = 110
target-version = "py311"
# verbatim agent output kept as produced
extend-exclude = ["docs/sample_output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["F403", "F405"]
"tests/fixtures/**/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
