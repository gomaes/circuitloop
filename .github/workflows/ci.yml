name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: bash -n install.sh && bash -n uninstall.sh

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ matrix.python }}
      # The agent is mocked in tests: no LLM is called in CI.
      - run: uv run pytest -q
      - name: CLI smoke test
        run: |
          uv run cloop doctor --agent mock || true
          uv run cloop init /tmp/demo --example ldo_5v
          uv run cloop verify examples/ldo_5v/reference/hardened_design.py --spec examples/ldo_5v/spec.yaml --out /tmp/verify

  test-arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install system packages (pacman)
        run: pacman -Syu --noconfirm --needed git python ngspice uv which
      - uses: actions/checkout@v4
      - run: uv sync --python /usr/bin/python3
      - run: uv run pytest -q
      - name: install.sh on Arch Linux
        run: |
          # no agent CLI in CI: install.sh finishes with `cloop doctor`, which reports it (exit 2)
          ./install.sh || test $? -eq 2
          export PATH="$HOME/.local/bin:$PATH"
          cloop doctor --agent mock
          cloop init /tmp/demo --example ne555_blinker
          cloop verify examples/ne555_blinker/reference/hardened_design.py --spec examples/ne555_blinker/spec.yaml --out /tmp/verify
