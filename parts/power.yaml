# Switching-converter parts. SPICE models are circuitloop's own behavioural
# approximations of typical datasheet behaviour (not vendor models).
MC34063:
  description: >-
    DC-DC converter controller with 1.5 A Darlington switch, DIP-8, 3-40 V. Oscillator
    set by CT (ton ~ 25000*CT s), 1.25 V feedback reference, cycle-by-cycle current
    limit when V(VCC)-V(IPK) > 0.3 V. For >1.5 A drive an external MOSFET from SWE.
  kind: ic
  package: dip8
  footprint: Package_DIP:DIP-8_W7.62mm
  mpn: MC34063ABP
  design: {vref: 1.25, i_chg: 2.2e-05, i_dischg: 0.00014, ct_swing: 0.5, v_ipk: 0.3, v_drive: 1.0}
  pins:
    1: {name: SWC, type: passive}
    2: {name: SWE, type: passive}
    3: {name: CT, type: passive}
    4: {name: GND, type: power_in}
    5: {name: FB, type: input}
    6: {name: VCC, type: power_in}
    7: {name: IPK, type: input}
    8: {name: DRC, type: passive}
  ratings:
    - {type: voltage, pins: [6, 4], max: 40, min: -0.3}
    - {type: voltage, pins: [5, 4], max: 40, min: -0.3}
    - {type: voltage, pins: [1, 4], max: 40, min: -0.3}
    - {type: current, pin: 1, max: 1.5}
    - {type: current, pin: 2, max: 1.5}
    - {type: power, max: 1.25}
  decoupling:
    - {pin: 6, gnd: 4, min: 1.0e-7}
  spice:
    type: subckt
    line: "X{ref} {1} {2} {3} {4} {5} {6} {7} {8} CL_MC34063 params: vref={p:vref}"
    params:
      vref: {value: 1.25, tolerance: 0.02}   # 1.225-1.275 V
    models: |
      .subckt CL_MC34063 SWC SWE CT GND FB VCC IPK DRC params: vref=1.25
      * oscillator: CT ramps between 0.75 V and 1.25 V; st = 1 while discharging
      Bst st GND V = 0.5*(1+tanh(100*(V(CT,GND) - 1.25 + 0.5*V(std))))
      Rstd st std 100
      Cstd std GND 50p
      * charge 22 uA (+2 mA once V(VCC,IPK) > 0.3 V: cycle-by-cycle current limit), discharge 140 uA
      Bct GND CT I = (1-V(std))*(22u + 0.5*(1+tanh(100*(V(VCC,IPK)-0.3)))*2m) - V(std)*140u
      * comparator (1.25 V) and latch: set while charging if FB < 1.25 V, reset while discharging
      Bcmp cmp GND V = 0.5*(1+tanh(300*({vref}-V(FB,GND))))
      Bq q GND V = 0.5*(1+tanh(30*((1-V(std))*V(cmp) - V(std) + 0.8*(V(qd)-0.5))))
      Rqd q qd 100
      Cqd qd GND 50p
      * Darlington output (about 1 V from SWC to SWE when on) and driver transistor (DRC)
      Bsw SWC SWE I = V(qd)*2.5*(max(V(SWC,SWE)-0.9,0) + 0.05*ln(1+exp(-abs(V(SWC,SWE)-0.9)/0.05)))
      Bdr DRC SWE I = V(qd)*0.01*(max(V(DRC,SWE)-0.7,0) + 0.05*ln(1+exp(-abs(V(DRC,SWE)-0.7)/0.05)))
      Rsw SWC SWE 100meg
      Bsup VCC GND I = 2.5m*0.5*(1+tanh(5*(V(VCC,GND)-2)))
      Rfb FB GND 10meg
      Rlk VCC GND 1meg
      .ends CL_MC34063

