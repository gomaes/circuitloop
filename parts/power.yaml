# ------------------------------------------------- buck (step-down) regulators
# CL_BUCK: circuitloop's behavioural model of the LM2596/LM2576/LM2575 family — fixed-frequency
# peak-current-mode control (PI error amplifier, slope compensation, cycle-by-cycle limit `ilim`),
# switch saturation ~ vsat + I/gsw, 1 ms soft start, ON/OFF (pin 5) active low. Fixed versions divide
# FB internally (kfb = 1.23 V / Vout). Simulate with transient.step <= 1/(50 fsw) and settle >= 3 ms.
.buck_models: &buck_models |
  .subckt CL_BUCK VIN SW GND FB ON params: kfb=1 vref=1.23 fsw=150k ilim=4.5 vsat=0.8 gsw=8 dmax=0.98 iq=5m rfb=100meg kp=10 ki=2e4 sc=0.25
  * clock: set pulse at each period start, forced-off window (max duty), ramp for slope compensation
  Vset set GND PULSE(0 1 0 1n 1n 20n {1/fsw})
  Vclk clk GND PULSE(0 1 {dmax/fsw} 1n 1n {(1-dmax)/fsw-3n} {1/fsw})
  Vramp ramp GND PULSE(0 1 0 {1/fsw-2n} 1n 1n {1/fsw})
  * error amplifier: PI on the (internally divided) feedback, 1 ms soft start, anti-windup integrator
  Be e GND V = {vref}*min(1, time/1m) - {kfb}*V(FB,GND)
  Bint GND xi I = {ki}*1u*(max(V(e),0)*0.5*(1-tanh(50*(V(xi)-{ilim}))) + min(V(e),0)*0.5*(1+tanh(50*V(xi))))
  Cxi xi GND 1u
  Bic ic GND V = max(min({kp}*V(e) + V(xi), {ilim}), 0)
  * peak-current comparator (blanked for the first 3 % of the period) and set/reset latch
  Bcmp cmp GND V = 0.5*(1+tanh(40*(i(Vsense) + {sc}*{ilim}*V(ramp) - V(ic))))
  Br r GND V = min(V(clk) + (1-V(clk))*V(cmp)*0.5*(1+tanh(200*(V(ramp)-0.03))), 1)
  Bc c GND V = V(set) - V(r)*(1-V(set))
  Vone one GND 1
  Sq one q c GND CL_SWBK
  .model CL_SWBK SW(VT=0 VH=0.5 RON=1 ROFF=1e9)
  Rq q GND 1k
  Rm q qm 1k
  Cm qm GND 10p
  * enable: ON/OFF pin below 1.3 V and VIN above ~4.5 V
  Ben en GND V = 0.5*(1-tanh(20*(V(ON,GND)-1.3)))*0.5*(1+tanh(10*(V(VIN,GND)-4.5)))
  * power switch VIN -> SW, current measured by Vsense
  Vsense VIN vi 0
  Bsw vi SW I = V(qm)*V(en)*{gsw}*(max(V(vi,SW)-{vsat},0) + 0.05*ln(1+exp(-abs(V(vi,SW)-{vsat})/0.05)))
  Rsw vi SW 100meg
  Bsup VIN GND I = {iq}*0.5*(1+tanh(5*(V(VIN,GND)-2)))
  Rfb FB GND {rfb}
  Ron ON GND 1meg
  .ends CL_BUCK
.buck_pins: &buck_pins
  1: {name: VIN, type: power_in}
  2: {name: SW}
  3: {name: GND, type: power_in}
  4: {name: FB, type: input}
  5: {name: "ON", type: input}
.lm2596_common: &lm2596_common
  kind: regulator
  package: to220_5
  footprint: Package_TO_SOT_THT:TO-220-5_P3.4x3.7mm_StaggerOdd_Lead3.8mm_Vertical
