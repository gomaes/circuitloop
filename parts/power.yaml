L_POWER_3A:
  description: Radial power inductor, 10 mm diameter, 5 mm pitch, 3 A rated (RMS) / 4 A saturation, DCR ~30 mOhm
  kind: inductor
  package: ind_r10
  footprint: Inductor_THT:L_Radial_D10.0mm_P5.00mm_Fastron_07P
  mpn: "Radial power inductor 3A {value}"
  value: required
  pins:
    1: {name: "1"}
    2: {name: "2"}
  ratings:
    - {type: current, pin: 1, max: 3.0, mode: rms}
    - {type: current, pin: 1, max: 4.0}
  spice:
    type: primitive
    line: |-
      L{ref} {1} {ref}_m {value}
      R{ref}_dcr {ref}_m {2} 0.03
      R{ref}_core {1} {2} 2k

