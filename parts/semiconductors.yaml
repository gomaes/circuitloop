# -------------------------------------------- Zener and TVS diode families
# The value is the Zener (breakdown) voltage in volts, e.g. part("ZENER_1W", "5.1"); the
# +/-5 % tolerance applies to it. Available in E24 steps (1N47xxA: 3.3-100 V, BZX55C: 2.4-75 V).
ZENER_1W:
  description: Zener diode 1 W (1N47xxA series), value = Zener voltage in V, +/-5 %, DO-41 (pin 1 = anode)
  kind: zener
  package: axial_400
  footprint: Diode_THT:D_DO-41_SOD81_P10.16mm_Horizontal
  mpn: "Zener 1W {value}V (1N47xxA)"
  value: required
  value_min: 3.3
  value_max: 100
  tolerance: 0.05
  design: {rz: 2.0, ibv: 0.01}
  pins: *diode_pins
  ratings:
    - {type: power, max: 1.0}
  spice:
    type: primitive
    line: |-
      D{ref} {1} {2} CLZ_{ref}
      .model CLZ_{ref} D(IS=1e-11 N=1.3 RS={d:rz} BV={value} IBV={d:ibv} CJO=1e-10)

ZENER_0.5W:
  description: Zener diode 0.5 W (BZX55C series), value = Zener voltage in V, +/-5 %, DO-35 (pin 1 = anode)
  kind: zener
  package: axial_300
  footprint: Diode_THT:D_DO-35_SOD27_P7.62mm_Horizontal
  mpn: "Zener 0.5W {value}V (BZX55C)"
  value: required
  value_min: 2.4
  value_max: 75
  tolerance: 0.05
  design: {rz: 8.0, ibv: 0.005}
  pins: *diode_pins
  ratings:
    - {type: power, max: 0.5}
  spice:
    type: primitive
    line: |-
      D{ref} {1} {2} CLZ_{ref}
      .model CLZ_{ref} D(IS=1e-12 N=1.3 RS={d:rz} BV={value} IBV={d:ibv} CJO=5e-11)

TVS_P6KE:
  description: >-
    600 W unidirectional TVS diode (P6KExxA), value = breakdown voltage in V (6.8-440, +/-5 %);
    stand-off voltage ~0.85 x value, DO-15 (pin 1 = anode)
  kind: tvs
  package: axial_500
  footprint: Diode_THT:D_DO-15_P12.70mm_Horizontal
  mpn: "P6KE{value}A"
  value: required
  value_min: 6.8
  value_max: 440
  tolerance: 0.05
  pins: *diode_pins
  ratings:
    - {type: power, max: 5.0}
  spice:
    type: primitive
    line: |-
      D{ref} {1} {2} CLT_{ref}
      .model CLT_{ref} D(IS=1e-10 N=1.5 RS=0.2 BV={value} IBV=1e-3 CJO=3e-9)

TVS_1.5KE:
  description: >-
    1500 W unidirectional TVS diode (1.5KExxA), value = breakdown voltage in V (6.8-440, +/-5 %);
    stand-off voltage ~0.85 x value, DO-201 (pin 1 = anode)
