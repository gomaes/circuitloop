# Discrete semiconductors. SPICE parameters are circuitloop's own approximations
# fitted to typical datasheet curves (not vendor models).
1N4007:
  description: 1 A / 1000 V general-purpose rectifier diode, DO-41 (pin 1 = anode)
  kind: diode
  package: axial_400
  footprint: Diode_THT:D_DO-41_SOD81_P10.16mm_Horizontal
  mpn: 1N4007
  pins:
    1: {name: A}
    2: {name: K}
  ratings:
    - {type: current, pin: 1, max: 1.0}
    - {type: voltage, pins: [2, 1], max: 1000, min: -2}
    - {type: power, max: 1.0}
  spice:
    type: primitive
    line: "D{ref} {1} {2} CL_D1N4007"
    models: ".model CL_D1N4007 D(IS=7e-9 N=1.85 RS=0.042 BV=1000 IBV=5e-6 CJO=1.5e-11 TT=4e-6)"

