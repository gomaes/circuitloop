# ------------------------------------------------------------ comparators
# CL_CMP: open-collector output that sinks (up to ~16 mA, Vsat ~0.25 V at 4 mA) when IN- > IN+;
# it needs a pull-up resistor. About 1 us response, no hysteresis (add it with resistors).
.cmp_models: &cmp_models |
  .subckt CL_CMP INP INN OUT VCC GND
  Bc c GND V = 0.5*(1+tanh(2000*(V(INN,GND)-V(INP,GND))))
  Rc c cd 1k
  Ccd cd GND 1n
  Bout OUT GND I = V(cd)*0.016*tanh(V(OUT,GND)/0.96)
  Rlk OUT GND 100meg
  Bsup VCC GND I = 0.4m*0.5*(1+tanh(5*(V(VCC,GND)-0.5)))
  .ends CL_CMP

