# ---------------------------------------------------------------- op-amps
# CL_OPAMP2 (TL072, NE5532, MCP6002): single-pole op-amp (open-loop gain aol, pole fp -> GBW =
# aol x fp) whose output swings from V- + voldrop to V+ - vohdrop. Slew rate, noise and input common-mode limits are
# not modelled: respect the input range stated in the description.
.dual_opamp_pins: &dual_opamp_pins
  1: {name: OUTA, type: output}
  2: {name: INNA, type: input}
  3: {name: INPA, type: input}
  4: {name: VEE, type: power_in}
  5: {name: INPB, type: input}
  6: {name: INNB, type: input}
  7: {name: OUTB, type: output}
  8: {name: VCC, type: power_in}
