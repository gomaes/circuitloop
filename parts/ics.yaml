TL072:
  description: >-
    Dual JFET-input op-amp, 3 MHz, supply 7-36 V total (e.g. +/-15 V or single 12 V with a mid-rail
    reference); inputs must stay above V- + 4 V and below V+, output swings to ~1.5 V from each rail, DIP-8
  kind: opamp
  package: dip8
  footprint: Package_DIP:DIP-8_W7.62mm
  mpn: TL072CP
  design: {voh_drop: 1.5, vol_drop: 1.5, vcc_min: 7.0, iq: 0.0028}
  pins: *dual_opamp_pins
  ratings:
    - {type: voltage, pins: [8, 4], max: 36, min: -0.3}
    - {type: voltage, pins: [2, 4], max: 36, min: -0.3}
    - {type: voltage, pins: [3, 4], max: 36, min: -0.3}
    - {type: voltage, pins: [5, 4], max: 36, min: -0.3}
    - {type: voltage, pins: [6, 4], max: 36, min: -0.3}
    - {type: current, pin: 1, max: 0.03}
    - {type: current, pin: 7, max: 0.03}
    - {type: power, max: 0.68}
  decoupling:
    - {pin: 8, gnd: 4, min: 1.0e-7}
  spice:
    type: subckt
    line: "X{ref} {1} {2} {3} {4} {5} {6} {7} {8} CL_TL072"
    models: |
      .subckt CL_OPAMP2 INP INN OUT VCC VEE params: aol=1e5 fp=10 vohdrop=1.5 voldrop=1.5 iq=1m
      Bg a VEE V = {aol}*V(INP,INN)
      Rp a b 1k
      Cp b VEE {1/(6283.2*fp)}
      Bo o VEE V = max(min(V(b,VEE), V(VCC,VEE)-{vohdrop}), {voldrop})
      Vso o o2 0
      Ro o2 OUT 50
      Bsup VCC VEE I = (max(i(Vso),0) + {iq})*0.5*(1+tanh(5*(V(VCC,VEE)-0.5)))
      Rlk VCC VEE 1meg
      .ends CL_OPAMP2
      .subckt CL_TL072 OUTA INNA INPA VEE INPB INNB OUTB VCC
      XA INPA INNA OUTA VCC VEE CL_OPAMP2 params: aol=2e5 fp=15 vohdrop=1.5 voldrop=1.5 iq=1.4m
      XB INPB INNB OUTB VCC VEE CL_OPAMP2 params: aol=2e5 fp=15 vohdrop=1.5 voldrop=1.5 iq=1.4m
      .ends CL_TL072
    note: "single-pole model (3 MHz); input common-mode limit not modelled"

