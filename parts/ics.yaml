LM317T:
  description: >-
    Adjustable 1.25-37 V 1.5 A linear regulator: Vout = 1.25 V x (1 + R2/R1) + 50 uA x R2 with R1 from
    OUT to ADJ (240 Ohm typical) and R2 from ADJ to GND; needs >= 10 mA load (R1 provides it with
    120-240 Ohm), 2 V dropout, TO-220 (1=ADJ 2=OUT 3=IN)
  kind: regulator
  package: to220v
  footprint: Package_TO_SOT_THT:TO-220-3_Vertical
  mpn: LM317T
  design: {vref: 1.25, dropout: 2.0, iadj: 5.0e-05}
  pins:
    1: {name: ADJ, type: input}
    2: {name: OUT, type: power_out}
    3: {name: IN, type: power_in}
  ratings:
    - {type: voltage, pins: [3, 2], max: 40, min: -0.3}
    - {type: current, pin: 2, max: 1.5}
    - {type: power, max: 1.6}
  spice:
    type: subckt
    line: "X{ref} {1} {2} {3} CL_LM317 params: vref={p:vref}"
    params: {vref: {value: 1.25, tolerance: 0.04}}
    models: |
      .subckt CL_LM317 ADJ OUT IN params: vref=1.25
      * OUT - ADJ held at vref while IN - OUT >= 2 V; the output current comes from IN
      Bv v ADJ V = max(min({vref}, V(IN,ADJ)-2.0), 0)
      Vs v v2 0
      Rout v2 OUT 0.01
      Bcomp IN ADJ I = i(Vs)
      Iadj IN ADJ 50u
      Rleak IN OUT 10meg
      .ends CL_LM317
