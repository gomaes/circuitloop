# Passive components. Ratings are absolute maximums; spec.derating is applied in
# normal operation, the raw value under fault injection.
R_1/4W:
  description: Carbon/metal film resistor, 1/4 W, axial (10.16 mm lead pitch)
  kind: resistor
  package: axial_400
  footprint: Resistor_THT:R_Axial_DIN0207_L6.3mm_D2.5mm_P10.16mm_Horizontal
  mpn: "MF 1/4W {value}"
  value: required
  pins:
    1: {name: "1"}
    2: {name: "2"}
  ratings:
    - {type: power, max: 0.25}
    - {type: voltage, pins: [1, 2], max: 250}
  spice: {type: primitive, line: "R{ref} {1} {2} {value}"}

