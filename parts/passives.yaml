# Passive components. Ratings are absolute maximums; spec.derating is applied in
# normal operation, the raw value under fault injection.
#
# Keys starting with "." are templates (YAML anchors only), not parts.

# ------------------------------------------------------------------ resistors
# Metal film (+/-1 %) for precision, carbon film (+/-5 %) where tolerance does not matter,
# precision metal film (+/-0.1 %) for references and measurement dividers.
.res_spice: &res_spice {type: primitive, line: "R{ref} {1} {2} {value}"}
.res_pins: &res_pins
  1: {name: "1"}
  2: {name: "2"}

R_1/4W:
  description: Metal film resistor, 1/4 W, +/-1 %, 50 ppm/K, axial (10.16 mm lead pitch)
  kind: resistor
  package: axial_400
