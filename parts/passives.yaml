# ---------------------------------------------- aluminium electrolytic capacitors
# General-purpose 105 C series. The can (footprint), ESR (100 kHz) and ripple-current rating
# (RMS, pin 1) follow the value; typical datasheet figures, check your series.
.ecap_spice: &ecap_spice
  type: primitive
  line: |-
    C{ref} {1} {ref}_esr {value}
    R{ref}_esr {ref}_esr {2} {d:esr}
.ecap_pins: &ecap_pins
  1: {name: POS}
  2: {name: NEG}
.ecap_sizes:
  - &d5 {value_max: 1, package: ecap_d5, footprint: "Capacitor_THT:CP_Radial_D5.0mm_P2.50mm", design: {esr: 1.2}, ratings: [{type: current, pin: 1, max: 0.1, mode: rms}]}
  - &d6 {value_max: 1, package: ecap_d5, footprint: "Capacitor_THT:CP_Radial_D6.3mm_P2.50mm", design: {esr: 0.6}, ratings: [{type: current, pin: 1, max: 0.2, mode: rms}]}
